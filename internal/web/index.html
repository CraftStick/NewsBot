<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NewsBot</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:light;--bg:#fff;--sbg:#efeff4;--tx:#000;--hint:#8e8e93;--ac:#0088ff;--act:#fff;--ln:#c8c7cc;--bad:#ff3b30;--ok:#00c900;--glass:rgba(255,255,255,.55);--glass-hi:rgba(255,255,255,.9);--drop:rgba(255,255,255,.85)}
*{box-sizing:border-box}
body{margin:0;font:17px/1.35 -apple-system,system-ui,sans-serif;color:var(--tx);background:var(--sbg)}
header{padding:24px 20px 6px}
header h1{margin:0;font-size:34px;font-weight:700;letter-spacing:.35px}
nav{display:flex;gap:2px;position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom));z-index:2;padding:4px;width:min(340px,calc(100% - 32px));border-radius:32px;background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--glass-hi);box-shadow:0 8px 28px rgba(0,0,0,.16),inset 0 1px 0 var(--glass-hi)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 7px;border:0;border-radius:28px;background:none;color:var(--hint);font:500 10px inherit;font-family:inherit}
nav button[aria-selected=true]{color:var(--ac)}
nav button{position:relative;z-index:1;transition:color .25s}
#drop{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:28px;background:var(--drop);box-shadow:0 2px 8px rgba(0,0,0,.12),inset 0 1px 0 var(--glass-hi),inset 0 -2px 4px rgba(0,136,255,.12)}
main{padding:8px 16px 120px;max-width:640px;margin:auto}
.card{background:var(--bg);border-radius:26px;padding:16px;margin-bottom:16px;overflow-wrap:anywhere}
.card img{width:100%;border-radius:18px;margin-bottom:10px;display:block}
.card a{color:var(--ac);text-decoration:none}
.row{display:flex;gap:8px;margin-top:14px}
.row button,.btn{flex:1;padding:12px 6px;border:0;border-radius:22px;font:600 15px inherit;font-family:inherit;background:var(--ac);color:var(--act)}
.row button.sec{background:var(--sbg);color:var(--tx)}
.btn{width:100%;font-size:17px;padding:15px}
.row button:active,.btn:active{opacity:.7}
textarea{width:100%;min-height:150px;border-radius:18px;border:1px solid var(--ln);background:var(--sbg);color:var(--tx);font:15px ui-monospace,monospace;padding:12px}
.hint{color:var(--hint);font-size:13px;margin-top:6px}
p.hint{text-align:center;margin:30px 10px;font-size:15px}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}
label.sw{display:flex;justify-content:space-between;align-items:center;padding:10px 0;gap:10px}
label.sw input{appearance:none;flex:none;width:51px;height:31px;border-radius:16px;background:rgba(120,120,128,.32);position:relative;margin:0;transition:.2s}
label.sw input::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:.2s}
label.sw input:checked{background:#34c759}
label.sw input:checked::after{left:22px}
</style></head><body>
<header><h1>Tree Shield News</h1></header>
<nav role="tablist"><i id="drop"></i><button role="tab" data-t="feed"><svg viewBox="0 0 22 22" width="20" height="20" aria-hidden="true"><path d="M2 11L20 3 12 19 10 13z" fill="currentColor"/></svg>Лента</button><button role="tab" data-t="status"><svg viewBox="0 0 22 22" width="20" height="20" aria-hidden="true"><path d="M3 18V11h4v7zM9 18V4h4v14zM15 18V8h4v10z" fill="currentColor"/></svg>Статус</button><button role="tab" data-t="set"><svg viewBox="0 0 22 22" width="20" height="20" aria-hidden="true"><circle cx="11" cy="11" r="6" fill="none" stroke="currentColor" stroke-width="3.5"/><g stroke="currentColor" stroke-width="4.5" fill="none"><path d="M11 1.5V5" transform="rotate(0 11 11)"/><path d="M11 1.5V5" transform="rotate(45 11 11)"/><path d="M11 1.5V5" transform="rotate(90 11 11)"/><path d="M11 1.5V5" transform="rotate(135 11 11)"/><path d="M11 1.5V5" transform="rotate(180 11 11)"/><path d="M11 1.5V5" transform="rotate(225 11 11)"/><path d="M11 1.5V5" transform="rotate(270 11 11)"/><path d="M11 1.5V5" transform="rotate(315 11 11)"/></g></svg>Настройки</button></nav>
<main id="m"></main>
<script>
const tg=Telegram.WebApp;tg.ready();tg.expand();
if(!tg.initData){document.body.innerHTML='<p class="hint">Закрытое приложение.</p>';throw 0}
const H={'X-Init-Data':tg.initData,'Content-Type':'application/json'};
const api=async(p,b)=>{const r=await fetch('/api/'+p,{method:b?'POST':'GET',headers:H,body:b?JSON.stringify(b):undefined});
 const j=await r.json().catch(()=>({error:'ошибка '+r.status}));if(!r.ok)throw new Error(j.error||r.status);return j};
const m=document.getElementById('m');
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// В ленту пускаем только b/i/a/code; всё остальное — текстом.
function safe(h){const d=new DOMParser().parseFromString('<body>'+h,'text/html').body;
 const w=n=>[...n.childNodes].map(c=>{if(c.nodeType==3)return esc(c.data);
  const t=c.tagName.toLowerCase(),i=w(c);
  if(t=='a'){const u=c.getAttribute('href')||'';return /^https?:/.test(u)?`<a href="${esc(u)}" target="_blank" rel="noopener">${i}</a>`:i}
  return ['b','i','code'].includes(t)?`<${t}>${i}</${t}>`:i}).join('');
 return w(d).replace(/\n/g,'<br>')}
const busy=async(f)=>{try{await f()}catch(e){tg.showAlert(e.message)}};
async function feed(){const l=await api('feed');
 m.innerHTML=l.length?'':'<p class="hint">Очередь пуста. Новые посты появятся здесь и в чате.</p>';
 for(const p of l){const c=document.createElement('div');c.className='card';
  c.innerHTML=(p.has_image?`<img alt="" src="/api/img?key=${p.key}&d=${encodeURIComponent(tg.initData)}">`:'')+
   `<div class="t">${safe(p.html)}</div><div class="hint">${new Date(p.at).toLocaleString('ru')}</div>
   <div class="row"><button data-a="pub">Опубликовать</button><button class="sec" data-a="edit">Править</button><button class="sec" data-a="skip">Пропустить</button></div>`;
  c.onclick=e=>{const a=e.target.dataset.a;if(!a)return;busy(async()=>{
   if(a=='pub'){if(!await new Promise(r=>tg.showConfirm('Опубликовать в канал?',r)))return;await api('publish',{key:p.key});c.remove()}
   if(a=='skip'){await api('skip',{key:p.key});c.remove()}
   if(a=='edit'){c.querySelector('.t').outerHTML=`<textarea>${esc(p.html)}</textarea>`;
    c.querySelector('.row').innerHTML='<button data-a="save">Сохранить</button><button class="sec" data-a="cancel">Отмена</button>'}
   if(a=='save'){await api('edit',{key:p.key,html:c.querySelector('textarea').value});feed()}
   if(a=='cancel')feed()})};
  m.append(c)}}
async function status(){const s=await api('status');
 m.innerHTML=`<div class="card"><b>В очереди:</b> ${s.pending}<br><b>Работает:</b> ${Math.floor(s.uptime_min/60)} ч ${s.uptime_min%60} мин</div>`+
 (s.sources||[]).map(x=>`<div class="card"><b>${esc(x.id)}</b><br><span class="${x.fails?'bad':'ok'}">${x.fails?'сбоев подряд: '+x.fails:'работает'}</span>
  <div class="hint">последний успех: ${x.last_ok?new Date(x.last_ok).toLocaleString('ru'):'ещё не было'}</div></div>`).join('')}
async function sett(){const r=await api('settings'),s=r.settings;s.off=s.off||[];
 m.innerHTML='<div class="card"><b>Источники</b>'+r.sources.map(id=>`<label class="sw">${esc(id)}<input type="checkbox" data-id="${esc(id)}" ${s.off.includes(id)?'':'checked'}></label>`).join('')+
 `</div><div class="card"><label class="sw">Тихие часы 00–08 (копить новости)<input type="checkbox" id="q" ${s.no_quiet?'':'checked'}></label></div>
 <button class="btn" id="sv">Сохранить</button>`;
 document.getElementById('sv').onclick=()=>busy(async()=>{await api('settings',{off:[...m.querySelectorAll('[data-id]')].filter(i=>!i.checked).map(i=>i.dataset.id),no_quiet:!document.getElementById('q').checked});tg.showAlert('Сохранено')})}
const tabs={feed,status,set:sett};
const drop=document.getElementById('drop');let cur=null;
function place(b,anim){const l=b.offsetLeft,w=b.offsetWidth;
 if(anim&&cur){const a=cur.offsetLeft,m=Math.min(a,l),e=Math.max(a,l)+w;
  drop.animate([{left:a+'px',width:cur.offsetWidth+'px'},{left:m+'px',width:(e-m)+'px',offset:.45},{left:l+'px',width:w+'px'}],{duration:480,easing:'cubic-bezier(.3,.9,.4,1)',fill:'forwards'})}
 else{drop.style.left=l+'px';drop.style.width=w+'px'}
 cur=b}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',x==b));place(b,cur&&cur!=b);busy(tabs[b.dataset.t])});
addEventListener('resize',()=>{drop.getAnimations().forEach(a=>a.cancel());place(cur,false)});
document.querySelector('nav button').click();
</script></body></html>
