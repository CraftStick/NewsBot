<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NewsBot</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#1aabff;--dk:#0b63b0;--sh:#1583d0;--ink:#0b3a66;--hint:#4a6f94;--r:22px 17px 24px 16px/17px 24px 16px 22px}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 -apple-system,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
header{text-align:center;padding:10px 12px 0}
header svg{width:min(250px,72%);height:auto;display:block;margin:auto}
header h1{margin:14px 0 10px;font-size:22px;color:#fff;letter-spacing:.3px;text-shadow:3px 3px 0 var(--sh)}
nav{display:flex;gap:10px;position:sticky;top:0;z-index:2;padding:8px 14px 14px;background:var(--bg)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border:3px solid var(--dk);border-radius:var(--r);background:var(--sh);color:#fff;font:700 13px inherit;font-family:inherit;box-shadow:0 5px 0 var(--dk)}
nav button[aria-selected=true]{background:#fff;color:var(--ink)}
main{padding:6px 20px 36px 14px;max-width:640px;margin:auto}
.card{background:#fff;border:3px solid var(--dk);border-radius:var(--r);padding:14px;margin-bottom:22px;overflow-wrap:anywhere;box-shadow:8px 10px 0 var(--sh)}
.card img{width:100%;border-radius:12px 9px 13px 8px;margin-bottom:10px;display:block;border:3px solid var(--dk)}
.card a{color:#0a7ad1;font-weight:600}
.row{display:flex;gap:10px;margin-top:14px}
.row button,.btn{flex:1;padding:10px 6px;border:3px solid var(--dk);border-radius:var(--r);font:800 14px inherit;font-family:inherit;background:var(--bg);color:#fff;box-shadow:0 5px 0 var(--dk);text-shadow:1px 1px 0 var(--dk)}
.row button.sec{background:#e3effb;color:var(--ink);text-shadow:none}
.btn{width:100%;font-size:17px;padding:13px}
.row button:active,.btn:active,nav button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--dk)}
textarea{width:100%;min-height:150px;border-radius:14px 10px 15px 9px;border:3px solid var(--dk);background:#f4f9ff;color:var(--ink);font:14px ui-monospace,monospace;padding:10px}
.hint{color:var(--hint);font-size:13px;margin-top:6px}
p.hint{text-align:center;margin:30px 10px;color:#fff;font-size:15px}
.ok{color:#0b8f7e;font-weight:800}.bad{color:#d63b3b;font-weight:800}
label.sw{display:flex;justify-content:space-between;align-items:center;padding:10px 0;gap:10px;font-weight:600}
label.sw input{appearance:none;flex:none;width:50px;height:30px;border-radius:16px;background:#cfe3f5;border:3px solid var(--dk);position:relative;margin:0;transition:.15s}
label.sw input::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--dk);box-sizing:content-box;margin:-3px 0 0 -3px;transition:.15s}
label.sw input:checked{background:var(--bg)}
label.sw input:checked::after{left:22px}
</style></head><body>
<header><h1>Tree Shield News</h1></header>
<nav role="tablist"><button role="tab" data-t="feed"><svg viewBox="0 0 22 22" width="20" height="20" aria-hidden="true"><path d="M2 11L20 3 12 19 10 13z" fill="currentColor"/></svg>Лента</button><button role="tab" data-t="status"><svg viewBox="0 0 22 22" width="20" height="20" aria-hidden="true"><path d="M3 18V11h4v7zM9 18V4h4v14zM15 18V8h4v10z" fill="currentColor"/></svg>Статус</button><button role="tab" data-t="set"><svg viewBox="0 0 22 22" width="20" height="20" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="11" cy="11" r="2.5" fill="currentColor"/></svg>Настройки</button></nav>
<main id="m"></main>
<script>
const tg=Telegram.WebApp;tg.ready();tg.expand();
const H={'X-Init-Data':tg.initData,'Content-Type':'application/json'};
const api=async(p,b)=>{const r=await fetch('/api/'+p,{method:b?'POST':'GET',headers:H,body:b?JSON.stringify(b):undefined});
 const j=await r.json().catch(()=>({error:'ошибка '+r.status}));if(!r.ok)throw new Error(j.error||r.status);return j};
const m=document.getElementById('m');
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// В ленту пускаем только b/i/a/code; всё остальное — текстом.
function safe(h){const d=new DOMParser().parseFromString('<body>'+h,'text/html').body;
 const w=n=>[...n.childNodes].map(c=>{if(c.nodeType==3)return esc(c.data);
  const t=c.tagName.toLowerCase(),i=w(c);
  if(t=='a'){const u=c.getAttribute('href')||'';return /^https?:/.test(u)?`<a href="${esc(u)}" target="_blank" rel="noopener">${i}</a>`:i}
  return ['b','i','code'].includes(t)?`<${t}>${i}</${t}>`:i}).join('');
 return w(d).replace(/\n/g,'<br>')}
const busy=async(f)=>{try{await f()}catch(e){tg.showAlert(e.message)}};
async function feed(){const l=await api('feed');
 m.innerHTML=l.length?'':'<p class="hint">Очередь пуста. Новые посты появятся здесь и в чате.</p>';
 for(const p of l){const c=document.createElement('div');c.className='card';
  c.innerHTML=(p.has_image?`<img alt="" src="/api/img?key=${p.key}&d=${encodeURIComponent(tg.initData)}">`:'')+
   `<div class="t">${safe(p.html)}</div><div class="hint">${new Date(p.at).toLocaleString('ru')}</div>
   <div class="row"><button data-a="pub">Опубликовать</button><button class="sec" data-a="edit">Править</button><button class="sec" data-a="skip">Пропустить</button></div>`;
  c.onclick=e=>{const a=e.target.dataset.a;if(!a)return;busy(async()=>{
   if(a=='pub'){if(!await new Promise(r=>tg.showConfirm('Опубликовать в канал?',r)))return;await api('publish',{key:p.key});c.remove()}
   if(a=='skip'){await api('skip',{key:p.key});c.remove()}
   if(a=='edit'){c.querySelector('.t').outerHTML=`<textarea>${esc(p.html)}</textarea>`;
    c.querySelector('.row').innerHTML='<button data-a="save">Сохранить</button><button class="sec" data-a="cancel">Отмена</button>'}
   if(a=='save'){await api('edit',{key:p.key,html:c.querySelector('textarea').value});feed()}
   if(a=='cancel')feed()})};
  m.append(c)}}
async function status(){const s=await api('status');
 m.innerHTML=`<div class="card"><b>В очереди:</b> ${s.pending}<br><b>Работает:</b> ${Math.floor(s.uptime_min/60)} ч ${s.uptime_min%60} мин</div>`+
 (s.sources||[]).map(x=>`<div class="card"><b>${esc(x.id)}</b><br><span class="${x.fails?'bad':'ok'}">${x.fails?'сбоев подряд: '+x.fails:'работает'}</span>
  <div class="hint">последний успех: ${x.last_ok?new Date(x.last_ok).toLocaleString('ru'):'ещё не было'}</div></div>`).join('')}
async function sett(){const r=await api('settings'),s=r.settings;s.off=s.off||[];
 m.innerHTML='<div class="card"><b>Источники</b>'+r.sources.map(id=>`<label class="sw">${esc(id)}<input type="checkbox" data-id="${esc(id)}" ${s.off.includes(id)?'':'checked'}></label>`).join('')+
 `</div><div class="card"><label class="sw">Тихие часы 00–08 (копить новости)<input type="checkbox" id="q" ${s.no_quiet?'':'checked'}></label></div>
 <button class="btn" id="sv">Сохранить</button>`;
 document.getElementById('sv').onclick=()=>busy(async()=>{await api('settings',{off:[...m.querySelectorAll('[data-id]')].filter(i=>!i.checked).map(i=>i.dataset.id),no_quiet:!document.getElementById('q').checked});tg.showAlert('Сохранено')})}
const tabs={feed,status,set:sett};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',x==b));busy(tabs[b.dataset.t])});
document.querySelector('nav button').click();
</script></body></html>
