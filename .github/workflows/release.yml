name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make build-linux
      - run: gh release create "$GITHUB_REF_NAME" treesheild-newsbot --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
